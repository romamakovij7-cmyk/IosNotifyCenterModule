<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="55%" stop-color="#152046"/>
      <stop offset="100%" stop-color="#1b2c5e"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5ee7ff"/>
      <stop offset="100%" stop-color="#7f52ff"/>
    </linearGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <circle cx="1010" cy="70" r="150" fill="#7f52ff" opacity="0.35" filter="url(#blur)"/>
  <circle cx="150" cy="260" r="170" fill="#5ee7ff" opacity="0.22" filter="url(#blur)"/>

  <!-- phone mock -->
  <g transform="translate(70,42)">
    <rect x="0" y="0" width="130" height="216" rx="22" fill="#0a0e1a" stroke="#ffffff" stroke-opacity="0.18"/>
    <rect x="6" y="6" width="118" height="204" rx="18" fill="url(#glass)"/>
    <rect x="14" y="14" width="60" height="6" rx="3" fill="#ffffff" opacity="0.75"/>
    <rect x="92" y="14" width="24" height="6" rx="3" fill="#ffffff" opacity="0.45"/>
    <text x="14" y="58" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#9fd8ff">17:26</text>
    <rect x="14" y="76" width="102" height="30" rx="12" fill="#ffffff" opacity="0.12"/>
    <rect x="22" y="85" width="12" height="12" rx="6" fill="#5ee7ff"/>
    <rect x="42" y="86" width="60" height="5" rx="2.5" fill="#ffffff" opacity="0.7"/>
    <rect x="42" y="94" width="40" height="4" rx="2" fill="#ffffff" opacity="0.4"/>
    <rect x="14" y="112" width="102" height="30" rx="12" fill="#ffffff" opacity="0.12"/>
    <rect x="22" y="121" width="12" height="12" rx="6" fill="#7f52ff"/>
    <rect x="42" y="122" width="52" height="5" rx="2.5" fill="#ffffff" opacity="0.7"/>
    <rect x="42" y="130" width="44" height="4" rx="2" fill="#ffffff" opacity="0.4"/>
  </g>

  <!-- title -->
  <text x="250" y="128" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="800" fill="#ffffff">iOS Notification</text>
  <text x="250" y="192" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="800" fill="url(#accent)">Shade</text>
  <text x="252" y="234" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#c9d6f5">An LSPosed module for Samsung One UI</text>

  <!-- pills -->
  <g font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#dbe6ff">
    <rect x="252" y="252" width="96" height="30" rx="15" fill="#ffffff" opacity="0.10"/>
    <text x="272" y="272">Kotlin</text>
    <rect x="358" y="252" width="120" height="30" rx="15" fill="#ffffff" opacity="0.10"/>
    <text x="378" y="272">LSPosed</text>
    <rect x="488" y="252" width="152" height="30" rx="15" fill="#ffffff" opacity="0.10"/>
    <text x="508" y="272">One UI 9</text>
  </g>
</svg>
